<!doctype html><meta charset="utf-8"><title>AEGIS surface colour QA</title><style>body{margin:0;background:#1a232a;color:#eef2f4;font:14px Arial}canvas{display:block}.label{position:absolute;font-weight:bold;pointer-events:none}</style>
<body>
<script src="../../js/lib/three.min.js"></script><script src="../../js/app/impact-surfaces.js"></script><script src="../../vendor/bullet-impacts/bullet-impacts.js"></script>
<script>
try{const T=THREE,W=1200,H=800,scene=new T.Scene(),camera=new T.PerspectiveCamera(40,W/H,.01,20),renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(W,H);renderer.setPixelRatio(1);renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;document.body.append(renderer.domElement);scene.background=new T.Color('#253139');scene.add(new T.HemisphereLight(0xe8f1ff,0x5a5141,1.5));const light=new T.DirectionalLight(0xfff2dc,2.4);light.position.set(-1.5,2,3);scene.add(light);
const specs=[['wood',0x342314,'WOOD / DARK'],['wood',0xd9ba8c,'WOOD / LIGHT'],['wood',0x536d61,'WOOD / GREEN PAINT'],['wood',0x8a4f37,'WOOD / RED BROWN'],['metal',0x364c3c,'METAL / GREEN'],['metal',0x727c85,'METAL / GREY'],['concrete',0x77756f,'CONCRETE'],['concrete',0x9c5942,'BRICK'],['fabric',0x5b654b,'FABRIC / OLIVE'],['fabric',0xa5956c,'FABRIC / SAND'],['soil',0x51402b,'SOIL / DARK'],['paper',0xd7ccb1,'PAPER']];
const decals=new GBulletImpacts.Decals(scene),panels=[],samples=[],labels=[];let seed=149;Math.random=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296};
for(let i=0;i<specs.length;i++){const [kind,color,label]=specs[i],canvas=document.createElement('canvas');canvas.width=canvas.height=128;const c=canvas.getContext('2d');c.fillStyle='#'+color.toString(16).padStart(6,'0');c.fillRect(0,0,128,128);c.globalAlpha=.12;c.strokeStyle='#ffffff';for(let x=0;x<128;x+=kind==='wood'?7:16){c.beginPath();c.moveTo(x,0);c.lineTo(x+Math.sin(x)*2,128);c.stroke();}const texture=new T.CanvasTexture(canvas);texture.colorSpace=T.SRGBColorSpace;
const m=new T.Mesh(new T.BoxGeometry(.48,.34,.06),new T.MeshStandardMaterial({map:texture,roughness:.8,metalness:kind==='metal'?.45:0}));m.position.set((i%4-1.5)*.56,(1-Math.floor(i/4))*.45,0);m.userData.impactSurface=kind;scene.add(m);m.updateMatrixWorld(true);panels.push(m);
const point=m.position.clone().setZ(.03),ray=new T.Raycaster(point.clone().add(new T.Vector3(0,0,.1)),new T.Vector3(0,0,-1)),hit=ray.intersectObject(m)[0],tint=GImpactSurfaces.tint(m,hit,kind);decals.add(point,new T.Vector3(0,0,1),kind,undefined,new T.Vector3(0,0,-1),1,m,tint);samples.push({kind,color,tint});const e=document.createElement('div');e.className='label';e.textContent=label;document.body.append(e);labels.push(e);}
camera.position.set(.05,.06,2.05);camera.lookAt(0,0,0);scene.updateMatrixWorld(true);renderer.render(scene,camera);for(let i=0;i<labels.length;i++){const p=panels[i].position.clone().add(new T.Vector3(-.23,.21,.04)).project(camera);labels[i].style.left=(p.x+1)*W/2+'px';labels[i].style.top=(1-p.y)*H/2+'px';}
window.TINT_QA={decals,renderer,scene,camera,panels,samples};window.ready=true;
}catch(e){window.failure=e.stack;console.error(e)}
</script>
