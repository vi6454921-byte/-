<!doctype html><meta charset="utf-8"><title>AEGIS — Deep material impacts v3</title>
<style>body{margin:0;background:#111c22;color:#e8ebed;font:14px Arial}canvas{display:block}.label{position:absolute;pointer-events:none;font-size:15px;font-weight:bold;letter-spacing:.08em}#heading{position:absolute;left:25px;top:20px;font-size:20px}#sub{position:absolute;left:25px;top:49px;color:#a9b6be;font-size:13px}</style>
<div id="heading">AEGIS — BULLET IMPACTS / MATERIAL RELIEF</div><div id="sub">Actual WebGL render · POM relief, not geometric destruction</div>
<script src="../../js/lib/three.min.js"></script><script src="../../vendor/bullet-impacts/bullet-impacts.js"></script>
<script>
try{
const T=THREE,W=1280,H=900,scene=new T.Scene(),cam=new T.PerspectiveCamera(43,W/H,.005,60),renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(W,H);renderer.setPixelRatio(1);document.body.append(renderer.domElement);scene.background=new T.Color('#17232c');renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;
scene.add(new T.HemisphereLight(0xddefff,0x36332b,1.3));const key=new T.DirectionalLight(0xffefd3,3.5);key.position.set(-1.6,2,1);scene.add(key);const fill=new T.DirectionalLight(0xa7c7ff,1.1);fill.position.set(2,.6,2);scene.add(fill);
function texture(kind){const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d'),im=g.createImageData(256,256);let seed=4381;function rand(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296;}for(let y=0;y<256;y++)for(let x=0;x<256;x++){let n=rand()-.5, rgb;if(kind==='wood'){const grain=Math.sin(x*.24+Math.sin(y*.035)*.6)*.5+Math.sin(x*.73)*.15;rgb=[101+grain*15+n*5,68+grain*10+n*4,37+grain*6+n*3]}else if(kind==='metal')rgb=[61+n*4,75+n*4,82+n*4];else if(kind==='paper')rgb=[176+n*4,169+n*4,147+n*4];else if(kind==='fabric'){const k=((x%5===0)||(y%5===0))?-12:0;rgb=[89+k+n*5,96+k+n*5,70+k+n*5]}else if(kind==='soil')rgb=[66+n*24,49+n*18,31+n*12];else rgb=[117+n*15,118+n*15,115+n*15];let k=(y*256+x)*4;for(let j=0;j<3;j++)im.data[k+j]=rgb[j];im.data[k+3]=255;}g.putImageData(im,0,0);const tex=new T.CanvasTexture(c);tex.colorSpace=T.SRGBColorSpace;tex.anisotropy=8;return tex;}
const kinds=['concrete','wood','metal','paper','fabric','soil'],labels=['CONCRETE — UNCHANGED','WOOD — SPLIT BORE','METAL — TORN PLATE','PAPER — CURLED TEAR','FABRIC — FRAYED HOLE','SOIL — EARTH CRATER'],panels=[],nodes=[];
for(let i=0;i<6;i++){const kind=kinds[i],p=new T.Mesh(new T.BoxGeometry(.43,.37,.075),new T.MeshStandardMaterial({map:texture(kind),roughness:kind==='metal'?.5:.91,metalness:kind==='metal'?.65:0}));p.position.set((i%3-1)*.5,(i<3?.24:-.24),0);p.name=kind;p.userData.grainAxis=[0,1,0];scene.add(p);panels.push(p);const e=document.createElement('div');e.className='label';e.textContent=labels[i];document.body.append(e);nodes.push(e)}scene.updateMatrixWorld(true);
let state=537;Math.random=()=>{state=(Math.imul(state,1664525)+1013904223)>>>0;return state/4294967296};
const decals=new GBulletImpacts.Decals(scene,{maxDecals:96,layer:0,parallax:true});for(let i=0;i<6;i++){const p=panels[i];decals.add(new T.Vector3(p.position.x,p.position.y,.0375),new T.Vector3(0,0,1),kinds[i],undefined,new T.Vector3(0,0,-1),1,p)}
function render(){scene.updateMatrixWorld(true);renderer.render(scene,cam);for(let i=0;i<6;i++){const v=panels[i].position.clone().add(new T.Vector3(-.215,.215,.04)).project(cam);nodes[i].style.left=((v.x+1)*W/2)+'px';nodes[i].style.top=((1-v.y)*H/2)+'px';nodes[i].style.display=mode==='all'?'block':'none'}}let mode='all';
function show(kind='all',angle=0,pom=true){mode=kind;
const meta=decals.aMeta.array;for(let i=0;i<6;i++){const slot=decals.ring[i],s=decals.slots[slot];for(let j=0;j<s.used;j++)meta[((slot*768+j)*4)+3]=(kind==='all'||kinds[i]===kind)?1:0;}decals.aMeta.clearUpdateRanges();decals.aMeta.needsUpdate=true;for(const p of panels)p.visible=kind==='all'||p.name===kind;decals.mesh.visible=true;const shader=decals.mesh.material.userData.compiledShader;if(shader)shader.uniforms.uPomOn.value=pom?1:0;
if(kind==='all'){cam.position.set(angle*.7,.04,1.48);cam.lookAt(0,0,0);cam.fov=43;document.getElementById('sub').textContent='Actual WebGL render · All six materials · POM '+(pom?'ON':'OFF');}else{const p=panels.find(p=>p.name===kind),d=.33;cam.position.set(p.position.x+Math.sin(angle)*d,p.position.y+.055,p.position.z+.0375+Math.cos(angle)*d);cam.lookAt(p.position.x,p.position.y,.0375);cam.fov=43;document.getElementById('sub').textContent=kind.toUpperCase()+' · angle '+Math.round(angle*180/Math.PI)+'° · POM '+(pom?'ON':'OFF')+' · visual relief';}cam.updateProjectionMatrix();render();return renderer.domElement.toDataURL('image/png');}
const original=decals.mesh.material.onBeforeCompile;decals.mesh.material.onBeforeCompile=s=>{original(s);decals.mesh.material.userData.compiledShader=s};
window.MATERIALS={T,scene,cam,renderer,decals,panels,show,render};show('all',0,true);window.materialReady=true;
}catch(e){window.materialError=e.stack;console.error(e)}
</script>
