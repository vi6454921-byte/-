<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>AEGIS v25 · стенд бойца</title>
<style>
html,body{margin:0;height:100%;background:#7d868f;overflow:hidden;font:13px system-ui;color:#eef}
#ui{position:fixed;left:10px;top:10px;background:#18222bdd;padding:10px 12px;border-radius:8px;max-width:300px;line-height:1.45}
#ui select,#ui button{font:12px system-ui;margin:2px 0}
</style></head><body>
<div id="ui"><b>Стенд бойца v25</b><br>
<label>Боец <select id="who"></select></label>
<label>Поза <select id="pose"><option>idle</option><option>tpose</option><option>ready</option><option>carry</option><option>grenade</option></select></label><br>
ЛКМ — вращение, колесо — приближение.<pre id="info" style="white-space:pre-wrap;margin:6px 0 0"></pre></div>
<script>
/* Стенд снаряжения бойца: только модули персонажа, без мира и ИИ.
   ?who=delta_1&pose=idle&yaw=0.4&pitch=0.1&dist=2.6&cy=1.1&fov=35&hide=vest,boot&only=vest */
window.__AEGIS_STAND = true;
const QS = new URLSearchParams(location.search);
const SRC = ['js/lib/three.min.js', 'assets/data/hands.js', 'assets/data/soldier_model.js', 'assets/data/soldier_tex.js',
  'js/polygon/00_boot.js', 'js/polygon/02_util.js', 'js/polygon/03_viewmodel_vm.js', 'js/polygon/04_viewmodel_hand_assets.js',
  'js/polygon/05_viewmodel_ak.js', 'js/polygon/06_textures.js', 'js/polygon/07_geobuf.js', 'js/polygon/08_skeleton.js',
  'js/polygon/09_soldier.js', 'js/polygon/10_soldier_body.js', 'js/polygon/11_soldier_clothing.js', 'js/polygon/12_soldier_gear.js',
  'js/polygon/13_soldier_kit.js', 'js/polygon/13b_soldier_cover.js', 'js/polygon/14_character.js', 'js/polygon/15_rig.js'];
const ROOT = '../../';
function load(i) {
  if (i >= SRC.length) return start();
  const s = document.createElement('script'); s.src = ROOT + SRC[i] + (QS.get('nc') ? '?' + Date.now() : '');
  s.onload = () => load(i + 1); s.onerror = () => { document.getElementById('info').textContent = 'нет ' + SRC[i]; };
  document.head.appendChild(s);
}
load(0);
async function start() {
  await GAssets.ready();
  const T = THREE;
  const R = new T.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  R.setPixelRatio(1); R.setSize(innerWidth, innerHeight);
  R.shadowMap.enabled = true; R.shadowMap.type = T.PCFSoftShadowMap;
  R.toneMapping = T.ACESFilmicToneMapping; R.toneMappingExposure = 1.0;
  if ('outputColorSpace' in R) R.outputColorSpace = T.SRGBColorSpace;
  document.body.appendChild(R.domElement);
  const scene = new T.Scene(); scene.background = new T.Color(0x7d868f);
  const pm = new T.PMREMGenerator(R);
  scene.environment = pm.fromScene(new __ADDONS.RoomEnvironment(), 0.04).texture;
  scene.environmentIntensity = 0.35;
  const sun = new T.DirectionalLight(0xfff1dc, 2.6); sun.position.set(-2.2, 4.5, -3.2); sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048); sun.shadow.camera.left = sun.shadow.camera.bottom = -1.4; sun.shadow.camera.right = sun.shadow.camera.top = 1.4;
  sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.012;
  scene.add(sun); scene.add(new T.HemisphereLight(0xcfd8e6, 0x4a4136, 0.8));
  const ground = new T.Mesh(new T.CircleGeometry(3, 48), new T.MeshStandardMaterial({ color: 0x6d6658, roughness: 1 }));
  ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
  const grid = new T.GridHelper(4, 40, 0x4c5550, 0x5d6662); grid.position.y = 0.001; scene.add(grid);
  const cam = new T.PerspectiveCamera(+(QS.get('fov') || 35), innerWidth / innerHeight, 0.02, 50);
  const who = document.getElementById('who'), poseSel = document.getElementById('pose');
  for (const k of GChar.ORDER) who.add(new Option(GChar.PRESETS[k].name || k, k));
  who.value = QS.get('who') || 'delta_1'; poseSel.value = QS.get('pose') || 'idle';
  const V = { yaw: +(QS.get('yaw') || 0.5), pitch: +(QS.get('pitch') || 0.08), dist: +(QS.get('dist') || 2.8), cy: +(QS.get('cy') || 1.05) };
  let ch = null, rig = null;
  function build() {
    if (ch) scene.remove(ch.root);
    const t0 = performance.now();
    ch = GChar.build(T, who.value);
    const ms = performance.now() - t0;
    scene.add(ch.root);
    rig = new GRig.Rig(T, ch);
    const hide = (QS.get('hide') || '').split(',').filter(Boolean), only = (QS.get('only') || '').split(',').filter(Boolean);
    for (const g in ch.meshes) ch.meshes[g].visible = !hide.includes(g) && (!only.length || only.includes(g));
    if (ch.hands && (hide.includes('hands') || (only.length && !only.includes('hands')))) for (const s in ch.hands) ch.hands[s].anchor.visible = false;
    pose(); 
    let nv = 0, list = [];
    for (const g in ch.meshes) { const n = ch.meshes[g].geometry.attributes.position.count; nv += n; list.push(g + ':' + n); }
    document.getElementById('info').textContent = 'build ' + ms.toFixed(0) + ' мс, вершин ' + nv + '\n' + list.join(' ');
    window.__CH = ch;
  }
  /* позы: ручная выкладка костей (риг оружия здесь не нужен) */
  function pose() {
    const b = ch.bone, P = poseSel.value;
    for (const bn of ch.bones) bn.rotation.set(0, 0, 0);
    ch.bone('hips').position.fromArray(ch.rest.hips);
    if (P !== 'tpose') {
      GRig.applyBasePose(rig, {});
      for (const side of [1, -1]) {
        const SS = side > 0 ? 'R' : 'L';
        if (P === 'idle') {
          b('shoulder' + SS).rotation.set(0, side * 0.18, -side * 1.25);
          b('elbow' + SS).rotation.set(0, side * 0.35, 0);
          b('wrist' + SS).rotation.set(0, 0, side * 0.1);
        } else if (P === 'ready') {
          b('shoulder' + SS).rotation.set(side > 0 ? 0.2 : 0.1, side * (side > 0 ? 0.65 : 0.95), -side * 1.05);
          b('elbow' + SS).rotation.set(0, side * (side > 0 ? 1.55 : 1.1), 0);
        } else if (P === 'carry') {
          b('shoulder' + SS).rotation.set(0, side * 0.6, -side * 0.6);
          b('elbow' + SS).rotation.set(0, side * 2.0, 0);
        } else if (P === 'grenade') {
          b('shoulder' + SS).rotation.set(0, side * 0.9, -side * (side > 0 ? 0.5 : 1.1));
          b('elbow' + SS).rotation.set(0, side * 1.6, 0);
        }
      }
    }
    ch.root.updateMatrixWorld(true);
    if (window.__STAND_POSE) window.__STAND_POSE(ch, P, T);
  }
  who.onchange = build; poseSel.onchange = pose;
  let drag = 0, px = 0, py = 0;
  R.domElement.onpointerdown = (e) => { drag = 1; px = e.clientX; py = e.clientY; };
  onpointerup = () => { drag = 0; };
  onpointermove = (e) => { if (!drag) return; V.yaw += (e.clientX - px) * 0.006; V.pitch = Math.max(-1.2, Math.min(1.3, V.pitch + (e.clientY - py) * 0.004)); px = e.clientX; py = e.clientY; };
  R.domElement.onwheel = (e) => { V.dist = Math.max(0.3, Math.min(8, V.dist * Math.exp(e.deltaY * 0.001))); };
  function place() {
    const c = new T.Vector3(V.cx || 0, V.cy, V.cz || 0);
    cam.position.set(c.x + Math.sin(V.yaw) * V.dist * Math.cos(V.pitch), V.cy + Math.sin(V.pitch) * V.dist, c.z - Math.cos(V.yaw) * V.dist * Math.cos(V.pitch));
    cam.lookAt(c); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix();
  }
  function frame() { requestAnimationFrame(frame); if (window.__STAND_STATIC) return; place(); R.render(scene, cam); }
  build();
  window.__STAND = { T, R, scene, cam, V, build, pose, place, render: () => { place(); R.render(scene, cam); }, get ch() { return ch; }, get rig() { return rig; } };
  if (!QS.get('static')) frame(); else { window.__STAND_STATIC = true; }
  window.__STAND_READY = true;
}
</script></body></html>
